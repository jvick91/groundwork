name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Force Node 24 for any JS-based action that hasn't yet shipped a Node 24 release
# (e.g. docker/setup-buildx-action is still on v3 / Node 20 as of 2026-04).
# actions/checkout@v5 already runs on Node 24; this env var carries everything else
# until each action releases its Node 24 update.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC-007 §14.1 — lint → type check → tests inside Docker
  backend-checks:
    name: Lint, type check, tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('backend/dockerfile', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # docker-compose.yml references .env and backend/.env.backend (both gitignored
      # since they hold local-dev secrets). Compose treats `env_file:` paths as
      # required by default and fails if they don't exist. Auth-mode env vars
      # (AUTH_STUB_ENABLED=false + OIDC_*) are required so the backend boots
      # with the real auth middleware enabled and the JWKSResolver targets the
      # containerized Keycloak realm (ADR-010). These aren't secrets — the
      # Keycloak test realm config is committed at docker/keycloak/.
      - name: Create env files for compose
        run: |
          touch .env
          cat > backend/.env.backend <<'EOF'
          APP_NAME=Groundwork
          APP_VERSION=0.1.0
          DEBUG=true
          ENVIRONMENT=development
          DATABASE_URL=postgresql+asyncpg://groundwork:groundwork@db:5432/groundwork
          TEST_DATABASE_URL=postgresql+asyncpg://groundwork:groundwork@db-test:5432/groundwork_test
          AUTH_STUB_ENABLED=false
          OIDC_DOMAIN=
          OIDC_ISSUER=http://keycloak-test:8080/realms/groundwork-test
          OIDC_AUDIENCE=https://api.groundwork.test/
          CORS_ORIGINS=["http://localhost:3000"]
          LOG_LEVEL=INFO
          LOG_JSON=false
          EOF

      # The backend image bakes pyproject.toml in, so any change there requires a rebuild.
      # The volume mount on app/ and tests/ keeps source iteration fast in dev — in CI we
      # are working from a fresh checkout so the mounted paths reflect the PR's tree.
      - name: Build backend image
        run: docker compose build backend

      - name: Start backend, test database, and Keycloak test realm
        run: |
          docker compose up -d backend db-test keycloak-test
          # Wait for db-test to be healthy so pytest can connect to the DB.
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' groundwork-db-test-1 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "db-test is healthy"
              break
            fi
            echo "Waiting for db-test... ($i/30): $STATUS"
            sleep 2
          done
          # Wait for keycloak-test to be healthy. Keycloak boots slower than
          # Postgres (~20-30s on a cold start) — its healthcheck has
          # start_period=30s + interval=5s + retries=30 (~3 min max).
          # Tests authenticate against this realm per ADR-010.
          for i in {1..60}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' groundwork-keycloak-test-1 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "keycloak-test is healthy"
              break
            fi
            echo "Waiting for keycloak-test... ($i/60): $STATUS"
            sleep 2
          done
          docker compose ps

      - name: Lint (ruff check)
        run: docker compose exec -T backend ruff check app/ tests/

      - name: Format check (ruff format --check)
        run: docker compose exec -T backend ruff format --check app/ tests/

      - name: Type check (mypy strict)
        run: docker compose exec -T backend mypy app/

      # Coverage threshold (--cov-fail-under=90) is enforced by pytest config (TASK-008).
      - name: Backend tests (pytest)
        run: docker compose exec -T backend pytest

      - name: Tear down compose
        if: always()
        run: docker compose down -v

  # SPEC-007 §14.1 — build stage runs on its own so a build break is reportable
  # even if the test stage above passes against a previously-cached image.
  build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create stub env files for compose
        run: |
          touch .env
          touch backend/.env.backend

      - name: Build backend image
        run: docker compose build backend

