services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
    env_file:
      - .env
      - ./backend/.env.backend
    entrypoint: ["bash", "/app/docker-entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundwork}
      POSTGRES_DB: ${POSTGRES_DB:-groundwork}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundwork}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundwork}
      POSTGRES_DB: groundwork_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundwork} -d groundwork_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-test:
    # Test-only IdP per ADR-010. Imports the realm at startup so the test
    # token-fetcher (backend/tests/conftest.py) and the auth middleware
    # have a real OAuth/OIDC issuer to talk to. Not used in dev/staging/prod.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
      - "9000:9000"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
