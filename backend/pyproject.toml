[tool.poetry]
name = "groundwork"
version = "0.1.0"
description = "Multi-tenant mental health practice management platform"
authors = ["Groundwork Team"]
readme = "README.MD"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.14.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
redis = "^5.0.0"
celery = {extras = ["redis"], version = "^5.4.0"}
structlog = "^24.0.0"
auth0-fastapi-api = ">=1.0.0b7"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.25.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
factory-boy = "^3.3.0"
coverage = "^7.0.0"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
